name: Check static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check homepage and local assets
        run: python tools/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check js/citations.js
          node --check js/preferences-init.js
          node --check js/preferences.js
          node --check js/home-bug.js
          node --check js/studio.js
          node --check js/studio-scene.js
          node --check js/travel-globe.js
          node --check js/travel-data.js
          node --check js/studio-animation.js
          node --check js/studio-entrance.js
          node --check js/studio-letter.js
          node --check js/planner.js
          node --check js/planner-config.js
          node --check js/planner-model.mjs
          node --check js/planner-auth.mjs
          node --check js/planner-days.mjs
          node --check js/planner-anniversaries.mjs
          node --check js/planner-ledger.mjs
          node --check js/planner-ledger-model.mjs
          node --check supabase/functions/planner-email-reminders/handler.mjs
      - name: Check planner recurrence and dates
        run: node --test tools/planner-model.test.mjs
      - name: Check planner login diagnostics
        run: node --test tools/planner-auth.test.mjs
      - name: Check anniversary day counts
        run: node --test tools/planner-days.test.mjs
      - name: Check anniversary email authorization and dispatch
        run: node --test tools/planner-email.test.mjs
      - name: Check ledger money and monthly dates
        run: node --test tools/planner-ledger.test.mjs
