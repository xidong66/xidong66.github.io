name: Check static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check homepage and local assets
        run: python tools/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check js/citations.js
          node --check js/preferences-init.js
          node --check js/preferences.js
          node --check js/studio.js
          node --check js/studio-scene.js
